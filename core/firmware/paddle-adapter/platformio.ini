; The paddle adapter firmware (README.md). Developed on an ESP32-S3-DevKitC-1
; N16R8 (marked HW678). env esp32s3: adapter plus paddle emulator, for
; developing YWC/IWC; env user: what users install, from dist/ (make-dist.ps1).
;
; Upload and monitor are pinned to COM5, the board's CH343 port. Never let
; PlatformIO search for a port: COM3 and COM4 are the FTdx101MP's CP2105, and
; esptool's reset toggles DTR/RTS, which on the Standard port can key the radio.

[env:esp32s3]
; PlatformIO's own ESP32 platform (Arduino-ESP32 2.x core). pioarduino's 3.x
; platform failed to install its toolchain on this PC (2026-10-31).
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
; The core's neopixelWrite() binds to the first pin it is given and ignores
; the pin in every later call, so the LED pin scan uses this library instead.
lib_deps =
    adafruit/Adafruit NeoPixel
build_flags =
    ; Serial is the UART on COM5, not the native USB, which will be MIDI.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; TinyUSB on the native USB port, so it can be a MIDI device. The board
    ; file sets 1; this later definition wins (gcc warns "redefined").
    -DARDUINO_USB_MODE=0

; The firmware users install from the web page: the paddle adapter alone, no
; emulator or test commands (USER_BUILD in main.cpp). 4 MB flash and DIO so
; the one file runs on any ESP32-S3 board with 4 MB or more; nothing here
; needs the PSRAM. The web page needs one merged file: see README.md.
[env:user]
extends = env:esp32s3
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
build_flags =
    ${env:esp32s3.build_flags}
    -DUSER_BUILD=1
