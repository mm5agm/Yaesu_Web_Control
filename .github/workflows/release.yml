# Named "Build" rather than "Build and Release Installer" because it runs on
# every PR into develop as a build-only smoke test, and the old name made a
# routine PR check look like it was about to publish a release. Nothing is
# released except on the `release` event -- see the guards on each upload step.
name: Build

# Retitles the run itself, so the Actions list says what a given run was for.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Smoke build - PR #{0} (nothing published)', github.event.number)
   || github.event_name == 'release' && format('Release {0} - building and publishing installers', github.event.release.tag_name)
   || 'Manual build' }}

on:
  release:
    types: [created]

  # Build every pull request into develop, so a PR arrives with a real signal
  # instead of "no checks". Added after shared-core phase 1 (#99) merged clean
  # and broke build-docker: nothing had run, because until now the only ways in
  # were a release and a manual dispatch, and the manual one happened after the
  # merge. build-docker is exactly the job that would have caught it.
  #
  # Nothing is published on this path. Every upload step is guarded by event
  # name, and the docker job's push flag falls into its `else` branch on any
  # event that is neither a release nor a dispatch carrying a tag — so a PR run
  # gets version=smoke, push=false, the GHCR login skips and the image is built
  # and discarded.
  #
  # build-macos is deliberately excluded (see its `if:`).
  pull_request:
    branches: [develop]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/upload to (e.g. v0.7.0)'
        required: false
        type: string

jobs:
  # Runs on every trigger, including pull requests. Until this existed the
  # workflow only ran `dotnet publish`, so a green tick meant "it compiles and
  # packages" and said nothing about the tests -- a PR could break every test in
  # the suite and still show all checks passed.
  #
  # The test project targets net10.0 only, so ubuntu is the cheapest host for it.
  # It is a standalone job rather than a gate on the build jobs: a failure should
  # be loud on the PR without adding its runtime to the front of every release
  # build. To make it actually block a merge, add "Build / test" to the required
  # status checks on develop -- none are configured at present.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test Tests/YaesuWebControl.Tests/YaesuWebControl.Tests.csproj --configuration Release --verbosity normal

  build-windows:
    # Unstable snapshots of develop are published by unstable.yml. Creating
    # that GitHub Release would otherwise re-enter this workflow (on:
    # release) and the docker job would try to parse unstable-YYYYMMDD as
    # SemVer.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'unstable-')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        run: |
          $v = dotnet --version 2>$null
          if ($v -and $v.StartsWith('10.')) {
            Write-Host ".NET $v already installed — skipping download"
          } else {
            Write-Host "Installing .NET 10..."
            Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile 'dotnet-install.ps1'
            .\dotnet-install.ps1 -Channel '10.0' -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet"
            $env:PATH = "$env:LOCALAPPDATA\Microsoft\dotnet;$env:PATH"
            Write-Host "Installed: $(dotnet --version)"
          }
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis --yes
        shell: pwsh

      - name: Publish 64-bit self-contained app
        run: |
          dotnet publish Yaesu_Web_Control.csproj `
            --framework net10.0-windows `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish
        shell: pwsh

      - name: List publish output
        run: |
          Write-Host "=== publish\\ ==="
          if (Test-Path publish) { Get-ChildItem publish -Name } else { Write-Host "publish dir missing!" }
          Write-Host "=== root ==="
          Get-ChildItem -Name
        shell: pwsh

      - name: Build NSIS installer
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) { $makensis = "C:\\Program Files (x86)\\NSIS\\makensis.exe" }
          if (!(Test-Path $makensis)) { Write-Error "makensis.exe not found at $makensis"; exit 1 }
          Write-Host "Using NSIS at: $makensis"
          & $makensis installer.nsi
          if ($LASTEXITCODE -ne 0) { Write-Error "NSIS failed (exit $LASTEXITCODE)"; exit 1 }
          $found = Get-ChildItem -Filter "*Setup*.exe" | Select-Object -First 1
          if (!$found) { Write-Error "No *Setup*.exe found after NSIS ran"; exit 1 }
          Write-Host "NSIS produced: $($found.FullName)"
          if ($found.Name -ne "Yaesu_Web_Control_Setup.exe") {
            Rename-Item $found.FullName "Yaesu_Web_Control_Setup.exe"
            Write-Host "Renamed to Yaesu_Web_Control_Setup.exe"
          }
        shell: pwsh

      - name: Verify installer was created
        run: |
          if (!(Test-Path "Yaesu_Web_Control_Setup.exe")) {
            Write-Error "Yaesu_Web_Control_Setup.exe not found after build"
            exit 1
          }
          Write-Host "OK: $('{0:N0}' -f (Get-Item Yaesu_Web_Control_Setup.exe).Length) bytes"
        shell: pwsh

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Yaesu_Web_Control_Setup
          path: Yaesu_Web_Control_Setup.exe

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        run: |
          # release event carries tag in GITHUB_REF_NAME; dispatch uses the input
          if ("${{ github.event_name }}" -eq "release") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "${{ github.event.inputs.tag }}"
          }

          Write-Host "Uploading installer to release: $tag"

          gh release upload "$tag" "Yaesu_Web_Control_Setup.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

  # Unsigned CAT-only .app DMGs (arm64 + x64). No Apple Developer ID / notarization.
  # workflow_dispatch with empty tag → artifacts only (safe branch smoke test).
  #
  # Skipped on pull requests, on wall-clock grounds rather than cost — both
  # repos are public, so Actions minutes are free. build-windows and
  # build-docker cover the same compile, and macOS still runs on dispatch and
  # on release. If a change is macOS-specific, hit "Run workflow" on the branch.
  #
  # timeout-minutes exists because this job can stall indefinitely. Observed
  # three times on 2026-08-13: build-dmg.sh runs two sequential publishes, and
  # the FIRST RID finished in under a minute while the SECOND stopped dead
  # straight after restore and never recovered — 36, 38 and 54 minutes before
  # being cancelled, with an orphaned dotnet/VBCSCompiler killed at cleanup.
  # Not our code: it reproduced on tag v2.4.3-pre6, which has no core/ subtree
  # in it at all and had built both DMGs in 1m50s three days earlier. Hosted
  # arm64 macOS runners, nothing in this repo.
  #
  # Why a timeout and not a retry: these jobs are independent — no `needs:` —
  # so a stalled macOS job does not hold up build-windows or build-docker, and
  # on a release that is the trap. The tag ships with the Windows installer and
  # the Docker image while the DMGs never upload, and the release looks
  # finished. Failing at 20 minutes (~10x the 1m50s normal, so a merely slow
  # runner won't trip it) makes that visible instead of silent.
  build-macos:
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'unstable-'))
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build macOS DMGs (arm64 + x64)
        run: |
          chmod +x scripts/macos/build-dmg.sh
          ./scripts/macos/build-dmg.sh all

      - name: List DMG output
        run: ls -lh publish/dmg/*.dmg

      - name: Upload DMGs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Yaesu_Web_Control_macOS_DMGs
          path: publish/dmg/*.dmg

      - name: Upload DMGs to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "Uploading macOS DMGs to release: $tag"
          gh release upload "$tag" publish/dmg/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Multi-arch CAT-only Linux image → GHCR (amd64 + arm64).
  # workflow_dispatch with empty tag → build only, no push (smoke test).
  build-docker:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'unstable-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write  # docker buildx GHA cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version and push flag
        id: prep
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # :latest only moves on full releases — never on pre-releases or smoke builds.
          latest=false
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.release.prerelease }}" != "true" ]; then
              latest=true
            fi
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            version="${{ github.event.inputs.tag }}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            # SemVer pre-release (e.g. v2.4.3-pre6) has a hyphen after the numeric version.
            ver="${version#v}"
            if [[ "$ver" != *-* ]]; then
              latest=true
            fi
          else
            echo "version=smoke" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.prep.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.push }}
            type=semver,pattern={{raw}},value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.push }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.latest }}
            type=raw,value=smoke,enable=${{ steps.prep.outputs.push != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.prep.outputs.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The three build jobs above are independent on purpose — no `needs:` between
  # them, so they run in parallel and a release is not held up by the slowest.
  # The cost of that is nobody notices when one of them does not finish: the
  # release event fires when the tag is created, each job uploads its own assets
  # to a release that already exists, and if one never gets there the tag simply
  # ends up short an asset. The release page looks finished. That is exactly what
  # a stalled build-macos produced on 2026-08-13 — installer and image present,
  # both DMGs missing, nothing red for six hours.
  #
  # This job is the only thing that actually checks. It runs last and in parallel
  # with nothing, so it costs the release no wall-clock time.
  verify-release-assets:
    # always() matters: without it a failed or cancelled `needs` would SKIP this
    # job, so the check would go silent in precisely the case it exists for.
    # The event guard stays inside the same expression — a dispatch or a PR has
    # no release to inspect.
    if: ${{ always() && github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'unstable-') }}
    needs: [build-windows, build-macos, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check every build job succeeded
        run: |
          fail=0
          for pair in "build-windows:${{ needs.build-windows.result }}" \
                      "build-macos:${{ needs.build-macos.result }}" \
                      "build-docker:${{ needs.build-docker.result }}"; do
            name="${pair%%:*}"; result="${pair##*:}"
            if [ "$result" = "success" ]; then
              echo "OK       $name"
            else
              echo "::error::$name did not succeed (result: $result)"
              fail=1
            fi
          done
          exit $fail

      - name: Check the release carries every expected asset
        # always() again, so a failed job above does not hide which assets are
        # actually missing — both answers are more useful than either alone.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "Assets on $tag:"
          echo "$names" | sed 's/^/  /'
          echo
          fail=0
          # Matched on a suffix rather than a full filename: the DMGs carry
          # AppVersion.Current (2.4.3), which is deliberately NOT the tag on a
          # pre-release (v2.4.3-pre6), so building the name from the tag would
          # fail every pre-release for the wrong reason.
          for want in 'Yaesu_Web_Control_Setup.exe' 'macos-arm64.dmg' 'macos-x64.dmg'; do
            if printf '%s\n' "$names" | grep -q -- "$want"; then
              echo "OK       $want"
            else
              echo "::error::missing from release $tag: $want"
              fail=1
            fi
          done
          # The Docker image is not a release asset — it goes to GHCR — so it is
          # covered by build-docker's job result in the step above, not here.
          exit $fail
