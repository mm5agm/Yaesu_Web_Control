name: Build and Release Installer

on:
  release:
    types: [created]

  # Build every pull request into develop, so a PR arrives with a real signal
  # instead of "no checks". Added after shared-core phase 1 (#99) merged clean
  # and broke build-docker: nothing had run, because until now the only ways in
  # were a release and a manual dispatch, and the manual one happened after the
  # merge. build-docker is exactly the job that would have caught it.
  #
  # Nothing is published on this path. Every upload step is guarded by event
  # name, and the docker job's push flag falls into its `else` branch on any
  # event that is neither a release nor a dispatch carrying a tag — so a PR run
  # gets version=smoke, push=false, the GHCR login skips and the image is built
  # and discarded.
  #
  # build-macos is deliberately excluded (see its `if:`).
  pull_request:
    branches: [develop]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/upload to (e.g. v0.7.0)'
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        run: |
          $v = dotnet --version 2>$null
          if ($v -and $v.StartsWith('10.')) {
            Write-Host ".NET $v already installed — skipping download"
          } else {
            Write-Host "Installing .NET 10..."
            Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile 'dotnet-install.ps1'
            .\dotnet-install.ps1 -Channel '10.0' -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet"
            $env:PATH = "$env:LOCALAPPDATA\Microsoft\dotnet;$env:PATH"
            Write-Host "Installed: $(dotnet --version)"
          }
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis --yes
        shell: pwsh

      - name: Publish 64-bit self-contained app
        run: |
          dotnet publish Yaesu_Web_Control.csproj `
            --framework net10.0-windows `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish
        shell: pwsh

      - name: List publish output
        run: |
          Write-Host "=== publish\\ ==="
          if (Test-Path publish) { Get-ChildItem publish -Name } else { Write-Host "publish dir missing!" }
          Write-Host "=== root ==="
          Get-ChildItem -Name
        shell: pwsh

      - name: Build NSIS installer
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) { $makensis = "C:\\Program Files (x86)\\NSIS\\makensis.exe" }
          if (!(Test-Path $makensis)) { Write-Error "makensis.exe not found at $makensis"; exit 1 }
          Write-Host "Using NSIS at: $makensis"
          & $makensis installer.nsi
          if ($LASTEXITCODE -ne 0) { Write-Error "NSIS failed (exit $LASTEXITCODE)"; exit 1 }
          $found = Get-ChildItem -Filter "*Setup*.exe" | Select-Object -First 1
          if (!$found) { Write-Error "No *Setup*.exe found after NSIS ran"; exit 1 }
          Write-Host "NSIS produced: $($found.FullName)"
          if ($found.Name -ne "Yaesu_Web_Control_Setup.exe") {
            Rename-Item $found.FullName "Yaesu_Web_Control_Setup.exe"
            Write-Host "Renamed to Yaesu_Web_Control_Setup.exe"
          }
        shell: pwsh

      - name: Verify installer was created
        run: |
          if (!(Test-Path "Yaesu_Web_Control_Setup.exe")) {
            Write-Error "Yaesu_Web_Control_Setup.exe not found after build"
            exit 1
          }
          Write-Host "OK: $('{0:N0}' -f (Get-Item Yaesu_Web_Control_Setup.exe).Length) bytes"
        shell: pwsh

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Yaesu_Web_Control_Setup
          path: Yaesu_Web_Control_Setup.exe

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        run: |
          # release event carries tag in GITHUB_REF_NAME; dispatch uses the input
          if ("${{ github.event_name }}" -eq "release") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "${{ github.event.inputs.tag }}"
          }

          Write-Host "Uploading installer to release: $tag"

          gh release upload "$tag" "Yaesu_Web_Control_Setup.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

  # Unsigned CAT-only .app DMGs (arm64 + x64). No Apple Developer ID / notarization.
  # workflow_dispatch with empty tag → artifacts only (safe branch smoke test).
  #
  # Skipped on pull requests, on wall-clock grounds rather than cost — both
  # repos are public, so Actions minutes are free. This job builds two DMGs and
  # routinely runs well over twenty minutes, which would leave every PR sitting
  # "in progress" long after the answer was known. build-windows and
  # build-docker cover the same compile in a fraction of the time, and macOS
  # still runs on dispatch and on release. If a change is macOS-specific, hit
  # "Run workflow" on the branch.
  build-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build macOS DMGs (arm64 + x64)
        run: |
          chmod +x scripts/macos/build-dmg.sh
          ./scripts/macos/build-dmg.sh all

      - name: List DMG output
        run: ls -lh publish/dmg/*.dmg

      - name: Upload DMGs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Yaesu_Web_Control_macOS_DMGs
          path: publish/dmg/*.dmg

      - name: Upload DMGs to GitHub Release
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "Uploading macOS DMGs to release: $tag"
          gh release upload "$tag" publish/dmg/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Multi-arch CAT-only Linux image → GHCR (amd64 + arm64).
  # workflow_dispatch with empty tag → build only, no push (smoke test).
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write  # docker buildx GHA cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version and push flag
        id: prep
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # :latest only moves on full releases — never on pre-releases or smoke builds.
          latest=false
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.release.prerelease }}" != "true" ]; then
              latest=true
            fi
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            version="${{ github.event.inputs.tag }}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            # SemVer pre-release (e.g. v2.4.3-pre6) has a hyphen after the numeric version.
            ver="${version#v}"
            if [[ "$ver" != *-* ]]; then
              latest=true
            fi
          else
            echo "version=smoke" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.prep.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.push }}
            type=semver,pattern={{raw}},value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.push }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.latest }}
            type=raw,value=smoke,enable=${{ steps.prep.outputs.push != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.prep.outputs.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
