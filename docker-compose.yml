# CAT-only Yaesu Web Control on Linux (x64 PC or arm64 Raspberry Pi).
#
# 1. Set YWC_SERIAL_DEVICE to your USB-serial node (ls /dev/ttyUSB* /dev/ttyACM*).
# 2. Optional Remote Audio: compose maps /dev/snd; set YWC_AUDIO_GID if needed
#    (getent group audio). Pick the radio USB codec in Settings → Remote Audio.
# 3. docker compose up -d --build
# 4. Open http://<host>:8080 and confirm Serial Port in Settings.
#
# Data volume: entrypoint chowns /data to the image `app` user on start, so a
# host-created ./data/ywc (often root-owned) does not need a manual chmod.
# Do not set `user:` here — entrypoint must start as root to fix ownership,
# then drops to `app` (and keeps group_add GIDs for serial/audio).
#
# Multi-arch image build (push to a registry):
#   docker buildx build --platform linux/amd64,linux/arm64 -t YOUR/ywc:latest --push .

services:
  ywc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ywc:local
    container_name: ywc
    restart: unless-stopped
    ports:
      - "${YWC_HTTP_PORT:-8080}:8080"
      - "${YWC_HTTPS_PORT:-8443}:8443"
    environment:
      TZ: ${TZ:-UTC}
      # Official ASP.NET images set this; keep it explicit for custom bases.
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      # Settings, radio_state, logs → host folder
      - ${YWC_DATA_DIR:-./data/ywc}:/data
    devices:
      # Pass the radio's USB-serial adapter into the container (same path inside).
      - ${YWC_SERIAL_DEVICE:-/dev/ttyUSB0}:${YWC_SERIAL_DEVICE:-/dev/ttyUSB0}
      # Host ALSA devices (radio USB audio codec for Remote Audio).
      # To pin one card only, replace with e.g. /dev/snd/controlC1 + pcmC1D0c/p.
      - /dev/snd:/dev/snd
    group_add:
      # Host "dialout" is usually GID 20 on Debian/Raspberry Pi OS.
      - "${YWC_DIALOUT_GID:-20}"
      # Host "audio" is usually GID 29 on Debian/Raspberry Pi OS.
      - "${YWC_AUDIO_GID:-29}"
