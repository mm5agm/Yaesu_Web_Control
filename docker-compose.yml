# CAT-only Yaesu Web Control on Linux (x64 PC or arm64 Raspberry Pi).
#
# 1. Set YWC_SERIAL_DEVICE to your USB-serial node (ls /dev/ttyUSB* /dev/ttyACM*).
# 2. Optional Remote Audio: compose maps /dev/snd; set YWC_AUDIO_GID if needed
#    (getent group audio). Pick the radio USB codec in Settings → Remote Audio.
# 3. Optional Radio Display: map UVC nodes (ls /dev/video*) — compose maps
#    video0 + video1 by default — and set YWC_VIDEO_GID to the host `video`
#    group (often 44). Pick the capture node in Settings → Radio Display
#    (usually video0, not metadata/codec). Keep Max width ≤ 800 on a Pi.
# 4. docker compose pull && docker compose up -d
#    (or pin a release: image: ghcr.io/mm5agm/yaesu_web_control:vX.Y.Z)
#    Local rebuild: docker compose up -d --build
# 5. Open http://<host>:8080 and confirm Serial Port in Settings.
#
# Data volume: entrypoint chowns /data to the image `app` user on start, so a
# host-created ./data/ywc (often root-owned) does not need a manual chmod.
# Do not set `user:` here — entrypoint must start as root to fix ownership,
# then drops to `app` (and keeps group_add GIDs for serial/audio/video).
#
# Multi-arch image is published to GHCR on each GitHub Release (amd64 + arm64).
# Local multi-arch build (push elsewhere):
#   docker buildx build --platform linux/amd64,linux/arm64 -t YOUR/ywc:latest --push .

services:
  ywc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mm5agm/yaesu_web_control:latest
    container_name: ywc
    restart: unless-stopped
    ports:
      - "${YWC_HTTP_PORT:-8080}:8080"
      - "${YWC_HTTPS_PORT:-8443}:8443"
    environment:
      TZ: ${TZ:-UTC}
      # Official ASP.NET images set this; keep it explicit for custom bases.
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      # Settings, radio_state, logs → host folder
      - ${YWC_DATA_DIR:-./data/ywc}:/data
    devices:
      # Pass the radio's USB-serial adapter into the container (same path inside).
      - ${YWC_SERIAL_DEVICE:-/dev/ttyUSB0}:${YWC_SERIAL_DEVICE:-/dev/ttyUSB0}
      # Host ALSA devices (radio USB audio codec for Remote Audio).
      # To pin one card only, replace with e.g. /dev/snd/controlC1 + pcmC1D0c/p.
      - /dev/snd:/dev/snd
      # Optional USB webcam / HDMI capture dongle for Radio Display (UVC/V4L2).
      # Comment out if unused. UVC dongles usually expose video0 (capture) plus
      # video1 (metadata). Map both; pick the capture node in Settings.
      - ${YWC_VIDEO_DEVICE:-/dev/video0}:${YWC_VIDEO_DEVICE:-/dev/video0}
      - ${YWC_VIDEO_DEVICE_ALT:-/dev/video1}:${YWC_VIDEO_DEVICE_ALT:-/dev/video1}
    group_add:
      # Host "dialout" is usually GID 20 on Debian/Raspberry Pi OS.
      - "${YWC_DIALOUT_GID:-20}"
      # Host "audio" is usually GID 29 on Debian/Raspberry Pi OS.
      - "${YWC_AUDIO_GID:-29}"
      # Host "video" is usually GID 44 on Debian/Raspberry Pi OS (Radio Display).
      - "${YWC_VIDEO_GID:-44}"
