# CAT-only Yaesu Web Control on Linux (x64 PC or arm64 Raspberry Pi).
#
# 1. Set YWC_SERIAL_DEVICE to your USB-serial node (ls /dev/ttyUSB* /dev/ttyACM*).
# 2. docker compose up -d --build
# 3. Open http://<host>:8080 and confirm Serial Port in Settings.
#
# Multi-arch image build (push to a registry):
#   docker buildx build --platform linux/amd64,linux/arm64 -t YOUR/ywc:latest --push .

services:
  ywc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ywc:local
    container_name: ywc
    restart: unless-stopped
    ports:
      - "${YWC_HTTP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
      # Official ASP.NET images set this; keep it explicit for custom bases.
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      # Settings, radio_state, logs → host folder
      - ${YWC_DATA_DIR:-./data/ywc}:/data
    devices:
      # Pass the radio's USB-serial adapter into the container (same path inside).
      - ${YWC_SERIAL_DEVICE:-/dev/ttyUSB0}:${YWC_SERIAL_DEVICE:-/dev/ttyUSB0}
    group_add:
      # Host "dialout" is usually GID 20 on Debian/Raspberry Pi OS.
      - "${YWC_DIALOUT_GID:-20}"
    # Uncomment if the serial node is still permission-denied after group_add:
    # user: "0:0"
